mcs.metadata:
  componentName: Fallback
  description: This system topic triggers when the user's utterance does not match any existing topics.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_LktzXw
      conditions:
        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: I couldn't get an answer from the connected sources. A source may be unavailable or slow; please try again.

      elseActions:
        - kind: BeginDialog
          id: 5aXj5M
          dialog: "{{agent_schema}}.topic.Escalate"
