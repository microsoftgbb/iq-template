version: 2

# Terraform providers and the dev container's Copilot and plugin pins are updated
# deliberately, not here; see AGENTS.md and the template-maintenance skill.
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The hosted agent's hashed requirements.txt is compiled from requirements.in.
  - package-ecosystem: pip
    directory: /agents/scenario-assistant
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /agents/scenario-assistant
      - /app
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
